<!DOCTYPE html>
<html>
<head>
    <title>Room 4 Test</title>
    <style>
        body { margin: 0; padding: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { createRoom4 } from './src/room4.js';

        // Create scene, camera, renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Create Room 4
        const room4 = createRoom4();
        console.log('Room 4 created:', room4);
        console.log('Room 4 children:', room4.children.map(child => child.name));
        
        // Position room
        room4.position.set(0, 0, -15);
        scene.add(room4);

        // Position camera to look at room
        camera.position.set(0, 5, -10);
        camera.lookAt(0, 0, -15);

        // Add some lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 10, 10);
        light.castShadow = true;
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        console.log('Scene children:', scene.children.map(child => child.name));
    </script>
</body>
</html>
